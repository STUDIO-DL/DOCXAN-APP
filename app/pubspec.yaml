name: docxan
description: "Docxan — escanea y organiza documentos offline-first"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^15.1.2
  intl: ^0.20.2
  supabase_flutter: ^2.10.0
  google_sign_in: ^6.3.0
  camera: ^0.11.2
  image_picker: ^1.1.2
  google_mlkit_text_recognition: ^0.15.0
  pdf: ^3.11.3
  printing: ^5.14.2
  path_provider: ^2.1.5
  path: ^1.9.1
  image: ^4.5.4
  shared_preferences: ^2.5.3
  crypto: ^3.0.6
  local_auth: ^2.3.0
  share_plus: ^11.0.0
  archive: ^4.0.7
  url_launcher: ^6.3.2
  drift: ^2.28.2
  sqlite3_flutter_libs: ^0.5.39
  flutter_secure_storage: ^9.2.4
  http: ^1.5.0
  uuid: ^4.5.1
  cryptography: ^2.7.0
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.28.2
  build_runner: ^2.4.15

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/images/logo.png
    - assets/images/logo_docxan.png
    - assets/legal/privacy.md
    - assets/legal/privacy_en.md
    - assets/legal/privacy_fr.md
    - assets/legal/terms.md
    - assets/legal/terms_en.md
    - assets/legal/terms_fr.md
